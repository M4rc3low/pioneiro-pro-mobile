name: Mobile Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - "v*"

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [apk, aab]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Instalar projeto
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install flet-android-notifications==0.11.2

      - name: Verificar ambiente
        run: |
          flutter --version
          flet --version

      - name: Gerar projeto Flutter e empacotar Python
        shell: bash
        run: |
          set +e
          flet build ${{ matrix.target }} --no-rich-output --yes
          FLET_STATUS=$?
          set -e

          if [ ! -d build/flutter ]; then
            exit "$FLET_STATUS"
          fi

      - name: Aplicar suporte a notificações Android
        run: flet-android-notifications-patch --project-root build/flutter

      - name: Integrar geofencing nativo
        run: python scripts/patch_native_geofencing.py build/flutter

      - name: Validar dependências Flutter
        working-directory: build/flutter
        run: flutter pub get

      - name: Analisar extensão nativa
        working-directory: native/pioneiro_pro_geofencing
        run: |
          flutter pub get
          flutter analyze

      - name: Recompilar Android com runtime Python
        shell: bash
        working-directory: build/flutter
        env:
          SERIOUS_PYTHON_SITE_PACKAGES: ${{ github.workspace }}/build/site-packages
        run: |
          APP_VERSION="$(python - <<'PY'
          import tomllib
          with open("../../pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"

          if [ "${{ matrix.target }}" = "apk" ]; then
            flutter build apk --release \
              --build-name "$APP_VERSION" \
              --build-number "${{ github.run_number }}"
          else
            flutter build appbundle --release \
              --build-name "$APP_VERSION" \
              --build-number "${{ github.run_number }}"
          fi

      - name: Preparar artefato Android
        shell: bash
        run: |
          rm -rf "build/${{ matrix.target }}"
          mkdir -p "build/${{ matrix.target }}"

          if [ "${{ matrix.target }}" = "apk" ]; then
            cp build/flutter/build/app/outputs/flutter-apk/app-release.apk \
              "build/apk/Pioneiro-Pro.apk"
          else
            cp build/flutter/build/app/outputs/bundle/release/app-release.aab \
              "build/aab/Pioneiro-Pro.aab"
          fi

      - name: Publicar artefato
        uses: actions/upload-artifact@v7
        with:
          name: pioneiro-pro-${{ matrix.target }}
          path: build/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Instalar projeto
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verificar ambiente
        run: |
          flutter --version
          flet --version

      - name: Construir iOS Simulator
        run: flet build ios-simulator --no-rich-output --yes

      - name: Publicar artefato
        uses: actions/upload-artifact@v7
        with:
          name: pioneiro-pro-ios-simulator
          path: build/ios-simulator
          if-no-files-found: error
          retention-days: 14
