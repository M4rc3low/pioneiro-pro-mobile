name: Mobile Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-mobile.yml"

jobs:
  android:
    name: Android ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [apk, aab]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar projeto
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Construir ${{ matrix.target }}
        run: flet build ${{ matrix.target }} --no-rich-output

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: pioneiro-pro-${{ matrix.target }}
          path: build/${{ matrix.target }}
          if-no-files-found: error

  ios-simulator:
    name: iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar projeto
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Construir iOS Simulator
        run: flet build ios-simulator --no-rich-output

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: pioneiro-pro-ios-simulator
          path: build/ios-simulator
          if-no-files-found: error
