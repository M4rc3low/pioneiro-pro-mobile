name: Mobile Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "pyproject.toml"

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [apk, aab]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Instalar projeto
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verificar ambiente
        run: |
          flutter --version
          flet --version

      - name: Construir ${{ matrix.target }}
        run: flet build ${{ matrix.target }} --no-rich-output --yes

      - name: Publicar artefato
        uses: actions/upload-artifact@v7
        with:
          name: pioneiro-pro-${{ matrix.target }}
          path: build/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Instalar projeto
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verificar ambiente
        run: |
          flutter --version
          flet --version

      - name: Construir iOS Simulator
        run: flet build ios-simulator --no-rich-output --yes

      - name: Publicar artefato
        uses: actions/upload-artifact@v7
        with:
          name: pioneiro-pro-ios-simulator
          path: build/ios-simulator
          if-no-files-found: error
          retention-days: 14
