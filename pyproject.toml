[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pioneiro_pro_mobile"
version = "0.5.1"
description = "Aplicativo mobile Pioneiro Pro para Android e iOS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.0",
    "flet-geolocator",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.flet]
product = "Pioneiro Pro"
org = "br.com.pioneiropro"
bundle_id = "br.com.pioneiropro.app"

[tool.flet.app]
path = "src"
module = "main"

[dependency-groups]
dev = [
    "flet[test]",
    "ruff>=0.11"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"


[tool.flet.splash]
color = "#F5F7FB"
dark_color = "#0F172A"

[tool.flet.android]
min_sdk_version = 24

[tool.flet.android.splash]
color = "#F5F7FB"
dark_color = "#0F172A"
icon_background = "#FFFFFF"

[tool.flet.android.permission]
"android.permission.ACCESS_FINE_LOCATION" = true
"android.permission.ACCESS_COARSE_LOCATION" = true
"android.permission.ACCESS_BACKGROUND_LOCATION" = true
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_LOCATION" = true

[tool.flet.ios.info]
NSLocationWhenInUseUsageDescription = "O Pioneiro Pro usa sua localização para avisar quando você estiver perto de uma visita ou estudante cadastrado."
NSLocationAlwaysAndWhenInUseUsageDescription = "O Pioneiro Pro pode usar sua localização em segundo plano para identificar visitas próximas."
NSLocationAlwaysUsageDescription = "O Pioneiro Pro pode usar sua localização em segundo plano para identificar visitas próximas."
UIBackgroundModes = ["location"]
